# mosquitto.conf
# Config minimale pour développement local.
# ⚠️ En production : activer l'authentification (password_file) et TLS.

listener 1883
protocol mqtt

# WebSocket, utile si le dashboard Angular veut consommer du MQTT
# directement depuis le navigateur.
listener 9001
protocol websockets

# Pas d'authentification en dev, tout le monde peut publier/s'abonner.
allow_anonymous true

# Persistence des messages sur disque (utile si le broker redémarre).
persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice
